<script
  type="module"
  src="https://unpkg.com/@splinetool/viewer@1.9.82/build/spline-viewer.js"
></script>

<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Assistant IA - Mochi</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <div id="appWrapper">
        <div class="avatarSection">
          <spline-viewer
            id="blueMochi"
            url="https://prod.spline.design/SWWqultOujbOuBRx/scene.splinecode"
          ></spline-viewer>
        </div>

        <!-- CHRONO UI -->
        <div id="chronoView">
          <div class="chronoContainer">
            <div class="timer-wrapper">
              <svg class="timer-ring" width="350" height="350">
                <!-- Cercle de fond -->
                <circle
                  class="progress-background"
                  stroke="#333"
                  stroke-width="20"
                  fill="transparent"
                  r="165"
                  cx="175"
                  cy="175"
                />

                <!-- Cercle animé -->
                <circle
                  class="progress-ring"
                  stroke="#6385b7"
                  stroke-width="20"
                  fill="transparent"
                  r="165"
                  cx="175"
                  cy="175"
                />

                <circle
                  id="progress-indicator"
                  r="10"
                  fill="#6385b7"
                  cx="340"
                  cy="175"
                />
                <circle
                  id="start-indicator"
                  r="10"
                  fill="#6385b7"
                  cx="340"
                  cy="175"
                />
              </svg>
              <div id="timeDisplay" class="time">00:00:00</div>
            </div>

            <div class="controls">
              <select id="companySelect">
                <option value="INES">INES</option>
                <option value="Autres">Autres</option>
              </select>
              <input
                type="text"
                id="taskDescription"
                placeholder="Nom de la tâche..."
              />

              <br />

              <button id="saveBtn">Sauvegarder</button>
              <button id="goToLogBtn">
                <img src="images/library.png" alt="" />
              </button>
            </div>
          </div>
        </div>

        <!-- JOURNAL -->
        <!-- JOURNAL VIEW -->
        <div id="logView" style="display: none">
          <h2 class="log-title">Tâches passées</h2>

          <div id="taskListContainer" class="log-container">
            <!-- JS viendra injecter les tâches ici -->
          </div>

          <div class="log-buttons">
            <button id="backToChronoBtn">
              <img src="images/back.png" alt="" />
            </button>
            <button id="deleteSelectedBtn">
              <img src="images/delete.png" alt="" />
            </button>
            <button onclick="exportToCSV()">
              <img src="images/export.png" alt="" />
            </button>
          </div>
        </div>

        <div class="chatChrono">
          <pre id="result" class="resultChrono">
Lorem ipsum dolor sit amet consectetur, adipisicing elit. Illoadipisicing elit. Illo,adipisicing elit. Illo ? </pre
          >
          <!-- Entrée utilisateur -->
          <input
            id="prompt"
            class="promptChrono"
            placeholder=" Des questions ? Je suis la juste pour ca !  Ecrit moi ici ! "
          />
        </div>

        <!-- Boutons -->
        <button id="btnAsk" onclick="ask()">
          <img src="images/Asset 3.png" alt="" />
        </button>
      </div>

      <!-- Résultat affiché -->
    </main>
    <script src="renderer.js"></script>
    <script src="chronoLogic.js"></script>
  </body>
</html>
