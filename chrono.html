<script

  src="https://unpkg.com/@splinetool/viewer@1.9.82/build/spline-viewer.js"

<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Assistant IA - Mochi</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="appWrapper">
      <div class="avatarSection">
        <spline-viewer
          id="blueMochi"
          url="https://prod.spline.design/SWWqultOujbOuBRx/scene.splinecode"
        ></spline-viewer>
      </div>

      <div class="main">
        <div class="leftSection"></div>
        <div class="midSection"></div>
        <div class="rightSection"></div>
      </div>
      <div class="chatChrono">
        <pre id="result" class="resultChrono">
Lorem ipsum dolor sit amet consectetur adipisicing elit. Consecte 
Consecte</pre
        >
        <!-- Entrée utilisateur -->
        <input
          id="prompt"
          class="promptChrono"
          placeholder=" Des questions ? Je suis la juste pour ca !  Ecrit moi ici ! "
        />
      </div>

      <!-- Boutons -->
      <button id="btnAsk" onclick="ask()">
        <img src="images/Asset 3.png" alt="" />
      </button>
    </div>

    <!-- Résultat affiché -->

    <script src="renderer.js"></script>
